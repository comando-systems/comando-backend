name: comando

services:
  postgres:
    build:
      context: ./database
    environment:
      POSTGRES_DB: $DB_NAME
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASS
    ports: [5432:5432]
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $DB_USER -d $DB_NAME]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    volumes: [../migrations:/migrations:ro]
    command:
      - -path
      - /migrations
      - -database
      - postgres://$DB_USER:$DB_PASS@$DB_HOST:5432/$DB_NAME?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  api:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    environment:
      NODE_ENV: $NODE_ENV
      HOST: $HOST
      PORT: $PORT
      DATABASE_READ_URL: postgres://$DB_USER:$DB_PASS@$DB_HOST:5432/$DB_NAME?sslmode=disable
      DATABASE_WRITE_URL: postgres://$DB_USER:$DB_PASS@$DB_HOST:5432/$DB_NAME?sslmode=disable
      JWT_SECRET: $JWT_SECRET
      JWT_ISSUER: $JWT_ISSUER
      JWT_AUDIENCE: $JWT_AUDIENCE
      JWT_EXPIRES_IN_SECONDS: $JWT_EXPIRES_IN_SECONDS
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      CORS_ORIGIN: $CORS_ORIGIN
      BODY_LIMIT_BYTES: $BODY_LIMIT_BYTES
      LOGIN_RATE_LIMIT_MAX: $LOGIN_RATE_LIMIT_MAX
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: $LOGIN_RATE_LIMIT_WINDOW_SECONDS
      LOG_LEVEL: $LOG_LEVEL
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
    expose: [$PORT]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:$PORT/health').then((response) => process.exit(response.ok ? 0: 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports: [$NGINX_PORT:80]
    volumes: [./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
