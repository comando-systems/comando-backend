name: comando-backend

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api: &api
  build:
    context: .
    dockerfile: api/Dockerfile
  image: comando-api
  environment:
    DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@postgres:${DB_PORT:-5432}/${DB_NAME}
    JWT_SECRET: ${JWT_SECRET}
    TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-28800}
  networks: [backend]
  logging: *logging

services:
  migrate:
    <<: *api
    command: ["bun", "run", "out/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    expose: [8080]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  seed:
    <<: *api
    profiles: ["tools"]
    command: ["bun", "run", "out/seed.js"]
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@postgres:${DB_PORT:-5432}/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    build:
      context: .
      dockerfile: .docker/database/Dockerfile
    restart: unless-stopped
    ports: ["${DB_PORT:-5432}:5432"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks: [backend]
    logging: *logging

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
