name: comando

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comando}
      POSTGRES_USER: ${POSTGRES_USER:-comando}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comando}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comando} -d ${POSTGRES_DB:-comando}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER:-comando}:${POSTGRES_PASSWORD:-comando}@postgres:5432/${POSTGRES_DB:-comando}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: "postgres://${POSTGRES_USER:-comando}:${POSTGRES_PASSWORD:-comando}@postgres:5432/${POSTGRES_DB:-comando}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-chars}"
      JWT_ISSUER: "${JWT_ISSUER:-comando}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-comando-api}"
      JWT_EXPIRES_IN_SECONDS: "${JWT_EXPIRES_IN_SECONDS:-900}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      BODY_LIMIT_BYTES: "${BODY_LIMIT_BYTES:-1048576}"
      LOGIN_RATE_LIMIT_MAX: "${LOGIN_RATE_LIMIT_MAX:-10}"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
