name: Capacity

# Manual only: it is slow and heavy, so it never runs on a pull request. It steps the number of
# concurrent users upward until an endpoint breaks p95 < 500 ms / p99 < 1 s, which gives a measured
# number to quote instead of a guess.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: Concurrent users per step, ascending, space separated
        default: "25 50 100 200 400 800"
      duration:
        description: How long each step holds its users (k6 duration)
        default: "60s"
      think_seconds:
        description: Average pause between a user's actions
        default: "1"
      web_concurrency:
        description: API server processes sharing the port (WEB_CONCURRENCY)
        default: "1"
      stop_on_break:
        description: Stop at the first step that breaks the budget
        type: boolean
        default: true

permissions:
  contents: read

env:
  HUSKY: "0"
  # Disposable CI values, not real credentials.
  JWT_SECRET: ci-disposable-value-for-tests-only-0123456789
  LOAD_EMAIL: capacity@example.com
  LOAD_PASSWORD: ci-capacity-test-password-123

jobs:
  capacity:
    name: Capacity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/database
        with:
          name: comando_capacity
      - name: Point the API at the disposable database
        # Built from parts: the database action creates this throwaway role, so there is no secret.
        run: |
          user=comando
          secret=comando
          url="postgres://${user}:${secret}@localhost:5432/comando_capacity?sslmode=disable"
          echo "DATABASE_READ_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_WRITE_URL=${url}" >> "$GITHUB_ENV"
      - run: bun run build
      - name: Create the capacity user
        run: ADMIN_EMAIL="$LOAD_EMAIL" ADMIN_PASSWORD="$LOAD_PASSWORD" bun run db:create-admin
      - name: Start the production build
        env:
          WEB_CONCURRENCY: ${{ inputs.web_concurrency }}
        run: |
          NODE_ENV=production CORS_ORIGIN=http://localhost HOST=127.0.0.1 PORT=3100 \
            LOGIN_RATE_LIMIT_MAX=10000 LOG_LEVEL=warn WEB_CONCURRENCY=${WEB_CONCURRENCY} \
            nohup bun dist/index.js > server.log 2>&1 &
      - run: scripts/smoke-test.sh http://127.0.0.1:3100
      - name: Step the concurrent users
        env:
          STEPS: ${{ inputs.steps }}
          DURATION: ${{ inputs.duration }}
          THINK_SECONDS: ${{ inputs.think_seconds }}
          STOP_ON_BREAK: ${{ inputs.stop_on_break }}
        run: scripts/capacity-run.sh http://127.0.0.1:3100 "$STEPS" "$DURATION" "$THINK_SECONDS" "$STOP_ON_BREAK"
      - name: Upload the summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-summaries
          path: capacity/
          if-no-files-found: ignore
      - name: Server log on failure
        if: failure()
        run: cat server.log
